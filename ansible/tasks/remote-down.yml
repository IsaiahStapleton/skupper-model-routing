---
- name: Remove only the owned remote namespace
  when: remote_state.results[0].stat.exists
  delegate_to: "{{ groups['model_hosts'][0] }}"
  block:
    - name: Check whether the site runtime was configured
      ansible.builtin.stat:
        path: "{{ remote_state_dir }}/internal/platform.yaml"
      register: remote_platform
    - name: Stop the remote Docker router
      ansible.builtin.command:
        argv: ["{{ remote_skupper_bin }}", system, stop, -p, docker, -n, "{{ remote_namespace }}"]
      when: remote_platform.stat.exists
      changed_when: true
    - name: Remove the owned namespace state
      ansible.builtin.file:
        path: "{{ remote_state_dir }}"
        state: absent
